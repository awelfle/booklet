<!doctype html>
<!-- Source for the README banner images (site/banner-light.png, site/banner-dark.png).
     Render at a 640×320 viewport with 2× pixels and screenshot, once per color scheme. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=640">
<title>Booklet banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&display=swap">
<style>
  :root { --paper: #f4efe6; --ink: #26221d; --muted: #6f665b; --accent: #b4532a; --line: #e3dacb; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #1b1916; --ink: #ede6da; --muted: #a59b8d; --accent: #e07a4b; --line: #36312b; }
  }
  html, body { margin: 0; width: 640px; height: 320px; overflow: hidden; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .banner { position: relative; width: 640px; height: 320px; }
  .text { position: absolute; left: 40px; top: 52px; width: 330px; }
  .brand { display: flex; align-items: center; gap: 7px; color: var(--accent);
    font: italic 600 30px/1 "Fraunces", Georgia, serif; letter-spacing: -.02em; margin-bottom: 22px; }
  h1 { font: 600 30px/1.08 "Fraunces", Georgia, serif; letter-spacing: -.02em; margin: 0 0 12px; }
  h1 em { color: var(--accent); }
  p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
  .phone { position: absolute; width: 138px; border-radius: 22px; padding: 5px; background: #15130f;
    box-shadow: 0 1px 2px rgba(0,0,0,.15), 0 14px 34px rgba(60,40,20,.25); }
  .phone img { display: block; width: 100%; border-radius: 18px; }
  .back { left: 468px; top: 30px; transform: rotate(5deg); }
  .front { left: 380px; top: 62px; transform: rotate(-4deg); }
</style>
</head>
<body>
<div class="banner">
  <div class="text">
    <div class="brand">
      <svg viewBox="0 -960 960 960" width="30" height="30" aria-hidden="true" fill="currentColor"><path d="M270-80q-45 0-77.5-29.64Q160-139.27 160-183v-564q0-36.57 22.12-65.43Q204.24-841.3 240-849l380-79v620l-360 77q-17.14 3.69-28.57 17.54Q220-199.62 220-183q0 19 15 31t35 12h470v-660h60v720H270Zm70-228 220-47v-499l-220 45v501Zm-60 12.81V-796l-20 4q-17 4-28.5 15.83Q220-764.35 220-747v471q9.06-5.2 19.03-9.1Q249-289 260-291l20-4.19ZM220-787v511-511Z"/></svg>
      Booklet
    </div>
    <h1>Your reading list,<br><em>kept on Are.na.</em></h1>
    <p>A small reading tracker for your phone. Your books live in your own Are.na channels — no new account, no server.</p>
  </div>
  <div class="phone back"><img src="/screens/dark.jpg" alt=""></div>
  <div class="phone front"><img src="/screens/shelf.jpg" alt=""></div>
</div>
</body>
</html>
