<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Booklet">
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)">
<title>Booklet</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fraunces italic 600, only for the wordmark -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <div class="top">
    <h1 class="brand">
      <!-- Material Symbols "book_5" (Apache 2.0) -->
      <svg viewBox="0 -960 960 960" width="30" height="30" aria-hidden="true" fill="currentColor">
        <path d="M270-80q-45 0-77.5-29.64Q160-139.27 160-183v-564q0-36.57 22.12-65.43Q204.24-841.3 240-849l380-79v620l-360 77q-17.14 3.69-28.57 17.54Q220-199.62 220-183q0 19 15 31t35 12h470v-660h60v720H270Zm70-228 220-47v-499l-220 45v501Zm-60 12.81V-796l-20 4q-17 4-28.5 15.83Q220-764.35 220-747v471q9.06-5.2 19.03-9.1Q249-289 260-291l20-4.19ZM220-787v511-511Z"/>
      </svg>
      Booklet
    </h1>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-shelf="toread">To Read <span class="count"></span></button>
    <button role="tab" data-shelf="reading">Reading <span class="count"></span></button>
    <button role="tab" data-shelf="read">Read <span class="count"></span></button>
  </nav>
</header>

<main id="list"></main>
<button class="fab" id="addBtn" aria-label="Add a book">+</button>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="addSheet" aria-label="Add a book">
  <!-- Stays pinned while the results scroll, so the search field is always visible. -->
  <div class="sheet-head">
    <div class="grabber"></div>
    <h2>Add a book</h2>
    <div class="shelf-pick" id="addShelf">
      <button data-shelf="toread" aria-pressed="true">To Read</button>
      <button data-shelf="reading" aria-pressed="false">Reading</button>
      <button data-shelf="read" aria-pressed="false">Read</button>
    </div>
    <div class="search">
      <input type="search" id="q" placeholder="Title, author, or ISBN" autocomplete="off" enterkeyhint="search">
    </div>
  </div>
  <div class="results" id="results"></div>
</section>

<section class="sheet" id="detailSheet" aria-label="Book"></section>

<section class="sheet" id="settingsSheet" aria-label="Settings">
  <div class="grabber"></div>
  <h2>Settings</h2>
  <p class="lede">Stored only on this device. <span id="version"></span></p>
  <label class="field" for="token">Are.na personal access token (write scope)</label>
  <input type="password" id="token" autocomplete="off" spellcheck="false">
  <div class="hint">Make one at <a href="https://www.are.na/settings/personal-access-tokens" target="_blank" rel="noopener">are.na/settings/personal-access-tokens</a>.</div>
  <label class="field" for="ch-toread">“To Read” channel slug</label>
  <input type="text" id="ch-toread" autocapitalize="off" spellcheck="false">
  <label class="field" for="ch-reading">“Reading” channel slug</label>
  <input type="text" id="ch-reading" autocapitalize="off" spellcheck="false">
  <label class="field" for="ch-read">“Read” channel slug</label>
  <input type="text" id="ch-read" autocapitalize="off" spellcheck="false">
  <div class="hint" id="shelvesHint"></div>
  <div class="actions">
    <!-- First run only: makes three channels on Are.na and saves. -->
    <button class="btn primary" id="createShelvesFirst" hidden>Create my shelves on Are.na</button>
    <button class="btn primary" id="saveSettings">Save</button>
  </div>
  <!-- Deliberately small and out of the way, with a confirmation: it makes new channels on Are.na. -->
  <p class="hint fine-print" id="startOver">Starting over? You can <a href="#" id="createShelves">create a new, empty set of shelves</a> on Are.na. Your current shelves and books stay where they are.</p>
</section>

<div class="toast" id="toast"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
